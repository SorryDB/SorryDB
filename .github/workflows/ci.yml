name: CI

on:
  pull_request:
    paths:
      - 'sorrydb/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lean
        id: lean-action
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          # use the test Lean directory to tell `lean-action` whcih version of Lean to download
          lake-package-directory: "tests/mock_lean_repository"

      # lean-interact probes `lake --version` from the process working
      # directory, not from the project directory it was handed, and pytest runs
      # from the repo root where there is no lean-toolchain. Without an elan
      # default that probe fails with "no default toolchain configured".
      - name: Set default Lean toolchain
        run: elan default "$(cat tests/mock_lean_repository/lean-toolchain)"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.1
          
      - name: Install dependencies
        run: poetry install --no-interaction
        
      - name: Run tests
        run: poetry run pytest -m "not local_only"

